services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-sso-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"

  discovery-server:
    build: ./discovery-server
    ports:
      - "8761:8761"

  auth-service:
    build: ./auth-service
    depends_on:
      - mongodb
      - kafka
      - rabbitmq
      - discovery-server
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      MONGODB_URI: mongodb://mongodb:27017/sso_auth
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: change-this-development-secret-to-at-least-32-characters-long
    ports:
      - "8081:8081"

  user-service:
    build: ./user-service
    depends_on:
      - mongodb
      - discovery-server
      - auth-service
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      MONGODB_URI: mongodb://mongodb:27017/sso_user
    ports:
      - "8082:8082"

  notification-service:
    build: ./notification-service
    depends_on:
      - mongodb
      - kafka
      - rabbitmq
      - discovery-server
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      MONGODB_URI: mongodb://mongodb:27017/sso_notification
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RABBITMQ_HOST: rabbitmq

  audit-service:
    build: ./audit-service
    depends_on:
      - mongodb
      - kafka
      - rabbitmq
      - discovery-server
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      MONGODB_URI: mongodb://mongodb:27017/sso_audit
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RABBITMQ_HOST: rabbitmq

  api-gateway:
    build: ./api-gateway
    depends_on:
      - discovery-server
      - auth-service
      - user-service
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      JWT_SECRET: change-this-development-secret-to-at-least-32-characters-long
    ports:
      - "8080:8080"

  sso-ui:
    build: ./enterprise-sso-ui
    depends_on:
      - api-gateway
    ports:
      - "4200:80"
    restart: unless-stopped